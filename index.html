<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FBABEE · Interactive Seller Console Tutorials</title>
<link rel="stylesheet" href="console/console.css" />
<link rel="stylesheet" href="console/guide.css" />
<style>
  /* ---------------- Library (top layer) — Featured Hero homepage ----------------
     Scoped under #library so nothing leaks into the player (which uses console.css).
     Brand palette + a few aliases for vars Option A used that console.css names differently. */
  #library { --navy: #1b214c; --navy2: #2a3270; --navy700: #141937;
    --orange: #f2922e; --orange600: #e07d18;
    --soft: var(--soft-line); --ink2: var(--ink-2);
    min-height: 100vh; background:
      radial-gradient(900px 520px at 8% -8%, #e8e9f5, transparent 60%),
      radial-gradient(820px 520px at 102% 4%, #fdf1e3, transparent 55%),
      #f4f5f8; }

  #library .bar { display: flex; align-items: center; gap: 14px; padding: 18px 40px; max-width: 1240px; margin: 0 auto; }
  #library .bar img { height: 28px; }
  #library .bar .div { width: 1px; height: 24px; background: var(--line); }
  #library .bar .ttl { font-family: var(--font-d); font-weight: 700; font-size: 14px; color: var(--ink); line-height: 1.25; }
  #library .bar .ttl span { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
  #library .bar .right { margin-left: auto; display: flex; align-items: center; justify-content: flex-end; min-width: 0;
    font-size: 12.5px; color: var(--muted); text-align: right; }

  #library .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 40px 64px; }
  #library .lvl { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--navy); }

  #library .go { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; color: var(--navy); font-size: 14px; }
  #library .cta { display: inline-flex; align-items: center; gap: 9px; height: 50px; padding: 0 26px; border-radius: 12px;
    background: var(--orange); color: #fff; font-family: var(--font-d); font-weight: 700; font-size: 15.5px;
    text-decoration: none; cursor: pointer; border: 0; transition: transform 140ms, box-shadow 140ms;
    box-shadow: 0 14px 30px -12px rgba(224,125,24,0.65); }
  #library .cta:hover { transform: translateY(-1px); box-shadow: 0 18px 36px -12px rgba(224,125,24,0.7); }
  #library .meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--faint); font-weight: 600; }

  #library .railmini { display: flex; align-items: center; }
  #library .railmini .node { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.25); flex: none; }
  #library .railmini .node.done { background: var(--orange); }
  #library .railmini .node.on { width: 15px; height: 15px; background: var(--orange); box-shadow: 0 0 0 4px rgba(242,146,46,0.22); }
  #library .railmini .seg { width: 22px; height: 2px; background: rgba(255,255,255,0.2); }
  #library .railmini .seg.fill { background: var(--orange); }

  /* ---- Featured hero ---- */
  #library .a-hero { display: grid; grid-template-columns: 1.18fr 1fr; background: #fff; border: 1px solid var(--line);
    border-radius: 22px; overflow: hidden; box-shadow: 0 30px 60px -40px rgba(27,33,76,0.55); margin-bottom: 34px; }
  #library .a-hero.live { cursor: pointer; transition: box-shadow 200ms, border-color 200ms; }
  #library .a-hero.live:hover { border-color: var(--navy); box-shadow: 0 36px 66px -40px rgba(27,33,76,0.6); }
  #library .a-hero .L { padding: 44px 44px 40px; display: flex; flex-direction: column; }
  #library .a-hero .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 800;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--orange600); }
  #library .a-hero .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--orange);
    box-shadow: 0 0 0 4px rgba(242,146,46,0.2); }
  #library .a-hero h1 { font-family: var(--font-d); font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.03em;
    color: var(--ink); margin: 16px 0 14px; }
  #library .a-hero p { font-size: 15.5px; line-height: 1.62; color: var(--muted); margin: 0 0 26px; max-width: 460px; }
  #library .a-hero .metarow { display: flex; gap: 22px; margin-bottom: 30px; }
  #library .a-hero .mstat { display: flex; flex-direction: column; gap: 3px; }
  #library .a-hero .mstat b { font-family: var(--font-d); font-weight: 800; font-size: 22px; color: var(--navy); letter-spacing: -0.02em; }
  #library .a-hero .mstat span { font-size: 11.5px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
  #library .a-hero .L .foot { margin-top: auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  #library .a-hero .L .foot .sub { font-size: 12.5px; color: var(--faint); }

  #library .a-hero .R { position: relative; background:
      radial-gradient(150% 120% at 90% -10%, var(--navy2), transparent 58%), var(--navy);
    padding: 40px 40px; overflow: hidden; }
  #library .a-hero .R::after { content: ""; position: absolute; right: -70px; bottom: -90px; width: 240px; height: 240px;
    border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.07); }
  #library .a-hero .R .cap { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.5); margin-bottom: 22px; }
  #library .vrail { display: flex; flex-direction: column; gap: 0; }
  #library .vrail .st { display: grid; grid-template-columns: 28px 1fr; gap: 14px; }
  #library .vrail .gut { display: flex; flex-direction: column; align-items: center; }
  #library .vrail .knob { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.22); flex: none; margin-top: 3px; }
  #library .vrail .st.done .knob { background: var(--orange); }
  #library .vrail .st.now .knob { width: 22px; height: 22px; margin-top: 0; background: var(--orange); box-shadow: 0 0 0 5px rgba(242,146,46,0.22); }
  #library .vrail .line { width: 2px; flex: 1; background: rgba(255,255,255,0.16); margin: 4px 0; min-height: 22px; }
  #library .vrail .st.done .line { background: var(--orange); }
  #library .vrail .lbl { color: rgba(255,255,255,0.92); font-weight: 600; font-size: 14.5px; padding-bottom: 22px; }
  #library .vrail .lbl small { display: block; color: rgba(255,255,255,0.5); font-weight: 500; font-size: 12px; margin-top: 2px; }
  #library .vrail .st:last-child .line { display: none; }

  /* ---- Library ---- */
  #library .a-secthead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; gap: 16px; flex-wrap: wrap; }
  #library .a-secthead h2 { font-family: var(--font-d); font-weight: 800; font-size: 21px; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
  #library .a-cats { display: flex; gap: 8px; flex-wrap: wrap; }
  #library .cat { padding: 8px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted);
    background: #fff; border: 1px solid var(--line); cursor: pointer; transition: all 140ms; }
  #library .cat:hover { border-color: var(--navy); color: var(--navy); }
  #library .cat.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  #library .a-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 1000px) { #library .a-grid { grid-template-columns: repeat(2, 1fr); } #library .a-hero { grid-template-columns: 1fr; } #library .a-hero .R { display: none; } }
  #library .ccard { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 20px; display: flex; flex-direction: column;
    box-shadow: 0 14px 36px -30px rgba(15,23,30,0.5); transition: transform 200ms, box-shadow 200ms, border-color 200ms; }
  #library .ccard.live { cursor: pointer; }
  #library .ccard.live:hover { border-color: var(--navy); box-shadow: 0 22px 46px -30px rgba(27,33,76,0.5); }
  #library .ccard.soon { opacity: 0.82; }
  #library .ccard .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #library .ccard .gicon { width: 38px; height: 38px; border-radius: 10px; background: var(--navy); display: grid; place-items: center; }
  #library .ccard .gicon .railmini .seg { width: 5px; }
  #library .ccard .soonbadge { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--soft); padding: 5px 11px; border-radius: 999px; }
  #library .ccard .lvl { margin-bottom: 6px; }
  #library .ccard h3 { font-family: var(--font-d); font-weight: 700; font-size: 16.5px; color: var(--ink); margin: 0 0 7px; line-height: 1.22; letter-spacing: -0.01em; }
  #library .ccard p { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 0 0 16px; flex: 1; }
  #library .ccard .cfoot { display: flex; align-items: center; justify-content: space-between; }
  #library .ccard.live:hover .cfoot .go { color: var(--orange600); }
  #library .a-empty { grid-column: 1 / -1; padding: 40px 0; color: var(--muted); }
</style>
</head>
<body>
  <div id="library">
    <div class="bar">
      <img src="console/fbabee-logo.png" alt="FBABEE" />
      <div class="div"></div>
      <div class="ttl">Interactive Seller Console Tutorials<span>Step-by-step Amazon FBA workflows for sellers</span></div>
      <div class="right"><span>Built for FBABEE customers · Safe demo environment</span></div>
    </div>

    <div class="wrap">
      <!-- Featured hero: the first live workflow, promoted. Rendered from data. -->
      <div id="libHero"></div>

      <!-- Library: remaining tutorials in a uniform, compact grid -->
      <div class="a-secthead">
        <h2>Browse all tutorials</h2>
        <div class="a-cats" id="libCats"></div>
      </div>
      <div class="a-grid" id="libGrid"></div>
    </div>
  </div>

  <div id="player" style="display:none"></div>

  <script src="console/data.js"></script>
  <script src="console/app.js"></script>
  <script src="console/pages.js"></script>
  <script src="console/send-to-fc.js"></script>
  <!-- Tutorials: shared scaffolding first, then one file per tutorial. -->
  <script src="console/tutorials/_shared.js"></script>
  <script src="console/tutorials/shipping-plan.js"></script>
  <script src="console/tutorials/print-fnsku-labels.js"></script>
  <script src="console/tutorials/removal-order.js"></script>
  <script src="console/tutorials/setup-assistant-account.js"></script>
  <script src="console/tutorials/get-reference-id.js"></script>
  <script src="console/tutorials/_placeholders.js"></script>
  <script src="console/guide.js"></script>
  <script src="console/_smoke.js"></script>
  <script>
    (function () {
      const heroEl = document.getElementById("libHero");
      const grid = document.getElementById("libGrid");
      const catsEl = document.getElementById("libCats");
      const list = Object.values(window.TUTORIALS);
      let standaloneDemo = false;
      const libraryTutorials = list
        .filter(t => Number.isFinite(t.libraryOrder))
        .sort((a, b) => a.libraryOrder - b.libraryOrder);

      // Featured = first live tutorial (has steps). Browse uses the same
      // tutorial data source and filters by category, including the featured item.
      const featured = list.find(t => !!t.steps) || null;
      const categoryOrder = ["Inventory", "Shipments", "Account Access"];
      const cats = ["All", ...categoryOrder.filter(c => libraryTutorials.some(t => t.category === c))];
      let activeCat = "All";
      const homepageHeroSummary = "Walk through the full Send to Amazon flow — from selecting inventory to downloading labels, pack lists, and completing carrier details.";
      const homepageHeroStages = [
        "Choose inventory",
        "Confirm shipping",
        "Print labels & pack lists",
        "Confirm carrier & tracking",
      ];

      function esc(s) { return String(s == null ? "" : s); }

      // ---- Featured hero (data-driven) ----
      function heroStages(t) {
        const order = (t.rail && t.rail.order) || [];
        const label = (t.rail && t.rail.label) || {};
        return order.filter(k => k !== "start" && k !== "done").map(k => label[k] || k);
      }
      function renderHero(t) {
        if (!t) { heroEl.innerHTML = ""; return; }
        const stages = homepageHeroStages;
        const minutes = "8–10";
        const railHtml = stages.map(s =>
          `<div class="st"><div class="gut"><i class="knob"></i><i class="line"></i></div><div class="lbl">${esc(s)}</div></div>`
        ).join("");
        heroEl.innerHTML = `<div class="a-hero live" data-id="${esc(t.id)}">
          <div class="L">
            <div class="badge">Most popular · Start here</div>
            <h1>${esc(t.title)}</h1>
            <p>${esc(homepageHeroSummary)}</p>
            <div class="metarow">
              <div class="mstat"><b>${esc(minutes)}</b><span>minutes</span></div>
              <div class="mstat"><b>${stages.length}</b><span>stages</span></div>
            </div>
            <div class="foot">
              <button class="cta" type="button">Start tutorial &#8594;</button>
              <span class="sub">Follow each step at your own pace</span>
            </div>
          </div>
          <div class="R">
            <div class="cap">What you'll walk through</div>
            <div class="vrail">${railHtml}</div>
          </div>
        </div>`;
      }

      // ---- Category pills ----
      catsEl.innerHTML = cats.map(c => `<span class="cat ${c === "All" ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</span>`).join("");
      catsEl.addEventListener("click", e => {
        const c = e.target.closest(".cat"); if (!c) return;
        activeCat = c.dataset.c;
        catsEl.querySelectorAll(".cat").forEach(x => x.classList.toggle("on", x.dataset.c === activeCat));
        renderGrid();
      });

      // ---- Compact library cards ----
      function card(t) {
        const live = !!t.steps;
        return `<div class="ccard ${live ? "live" : "soon"}" ${live ? `data-id="${esc(t.id)}"` : ""}>
          <div class="top">
            <div class="gicon"><div class="railmini"><i class="node done"></i><i class="seg fill"></i><i class="node on"></i><i class="seg"></i><i class="node"></i></div></div>
            ${live ? "" : `<span class="soonbadge">Coming soon</span>`}
          </div>
          <div class="lvl">${esc(t.level || "Workflow")}</div>
          <h3>${esc(t.title)}</h3>
          <p>${esc(t.summary)}</p>
          <div class="cfoot">
            <span class="meta">${esc(t.est || "—")}</span>
            ${live ? `<span class="go">Start tutorial &#8594;</span>` : `<span class="go" style="color:var(--faint)">In production</span>`}
          </div>
        </div>`;
      }

      function renderGrid() {
        const items = libraryTutorials
          .filter(t => activeCat === "All" || t.category === activeCat);
        grid.innerHTML = items.length
          ? items.map(card).join("")
          : `<div class="a-empty">No tutorials in this category yet.</div>`;
      }

      // ---- Open a tutorial ----
      function openTutorial(id) {
        document.getElementById("library").style.display = "none";
        const host = document.getElementById("player");
        host.style.display = "block";
        window.Guide.start(id, host, backToLibrary);
      }
      function backToLibrary() {
        document.getElementById("player").style.display = "none";
        document.getElementById("library").style.display = "";
      }
      function openDemoConsole(pushHash) {
        if (pushHash !== false && window.location.hash !== "#demo") {
          window.location.hash = "demo";
          return;
        }
        standaloneDemo = true;
        document.getElementById("library").style.display = "none";
        const host = document.getElementById("player");
        host.style.display = "block";
        host.innerHTML = `<div id="app" style="height:100vh"></div>`;
        window.App.reset();
        window.App.mount(host.querySelector("#app"));
      }
      function closeDemoConsole() {
        if (!standaloneDemo) return;
        standaloneDemo = false;
        const host = document.getElementById("player");
        host.innerHTML = "";
        backToLibrary();
      }

      heroEl.addEventListener("click", e => {
        const h = e.target.closest(".a-hero.live"); if (!h) return;
        openTutorial(h.dataset.id);
      });
      grid.addEventListener("click", e => {
        const c = e.target.closest(".ccard.live"); if (!c) return;
        openTutorial(c.dataset.id);
      });
      window.addEventListener("hashchange", () => {
        if (window.location.hash === "#demo") openDemoConsole(false);
        else closeDemoConsole();
      });

      renderHero(featured);
      renderGrid();
      if (window.location.hash === "#demo") openDemoConsole(false);
    })();
  </script>
</body>
</html>
